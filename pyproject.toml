[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--cov=custom_components.ha_dreame",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["custom_components/ha_dreame"]

[tool.coverage.report]
fail_under = 95
show_missing = true
